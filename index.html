<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Website Dashboard</title>
<style>
:root{--bg:#111317;--panel:#1b1f26;--panel2:#232832;--border:#343b47;--text:#f3f5f7;--muted:#aeb7c4;--accent:#4d8dff;--danger:#d95050;--bar:118px;--gap:8px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}body.scroll{overflow:auto}header{height:var(--bar);padding:10px;background:#0d0f12;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:8px;align-items:center;min-width:0}h1{font-size:18px;margin:0 14px 0 0;white-space:nowrap}input.url{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}button,select{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:7px;padding:8px 10px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.danger:hover{background:var(--danger)}#status{flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note{font-size:11px;color:var(--muted)}#dashboard{height:calc(100vh - var(--bar));display:grid;gap:var(--gap);padding:var(--gap);overflow:hidden}body.scroll #dashboard{height:auto;min-height:calc(100vh - var(--bar));grid-template-columns:repeat(auto-fit,minmax(420px,1fr))!important;grid-template-rows:auto!important;overflow:visible}.card{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:var(--panel);display:flex;flex-direction:column}.card.dragging{opacity:.45}body.scroll .card{height:500px}.head,.tcontrols{display:flex;align-items:center;gap:5px;padding:5px;background:var(--panel2);border-bottom:1px solid var(--border)}.head{min-height:42px}.handle{cursor:grab;color:var(--muted);padding:4px;font-size:17px}.panelurl{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--border);border-radius:6px;background:#15181e;color:var(--text)}.small{padding:6px 8px}.tcontrols{background:#15181e;min-height:38px;font-size:11px}.tcontrols label{color:var(--muted);white-space:nowrap}.quality{min-width:90px;max-width:135px;padding:5px}.vol{width:100px;min-width:55px}.volnum{width:34px;text-align:right;color:var(--muted)}.frame{flex:1;min-height:0;position:relative;background:#000}.frame iframe,.twitchhost,.twitchhost>div,.twitchhost iframe{width:100%!important;height:100%!important;border:0;display:block}.msg,.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px}.msg{position:absolute;inset:0;background:#0e0f12;color:var(--text)}.msg strong,.empty strong{display:block;margin-bottom:8px;font-size:16px}.empty{grid-column:1/-1;border:1px dashed var(--border);border-radius:12px}.mute{min-width:40px}@media(max-width:760px){:root{--bar:174px}header{padding:8px}.row{flex-wrap:wrap}h1{width:100%}#status{flex-basis:100%}body.scroll #dashboard{grid-template-columns:1fr!important}.tcontrols{flex-wrap:wrap}.vol{flex:1}}
</style>
</head>
<body>
<header>
<div class="row"><h1>Multi-Website Dashboard</h1><input id="newUrl" class="url" placeholder="Paste a website URL"><button id="add" class="primary">+ Add Website</button></div>
<div class="row"><button id="mode">Mode: Fit All</button><button id="reloadAll">Reload All</button><button id="clear" class="danger">Clear All</button><div id="status">Websites and Twitch settings are saved in this browser.</div><div class="note">Twitch links get independent quality, volume and mute controls.</div></div>
</header>
<main id="dashboard"></main>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
const STORE='multiWebsiteDashboard.v2',OLD='multiWebsiteDashboard.v1',MODE='multiWebsiteDashboard.mode.v1';
const $=s=>document.querySelector(s),dash=$('#dashboard'),newUrl=$('#newUrl'),status=$('#status');let mode=localStorage.getItem(MODE)||'fit',dragId=null,players=new Map(),sites=load();
function id(){return crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
function norm(v){v=v.trim();if(!v)return'';if(!/^https?:\/\//i.test(v))v='https://'+v;try{return new URL(v).href}catch{return''}}
function twitchChannel(u){try{const x=new URL(u),h=x.hostname.toLowerCase().replace(/^www\./,'');if(!['twitch.tv','m.twitch.tv'].includes(h))return'';const p=x.pathname.split('/').filter(Boolean),r=new Set(['directory','downloads','jobs','p','search','settings','subscriptions','turbo','videos','wallet']);if(!p[0]||r.has(p[0].toLowerCase())||!/^[a-z0-9_]{1,25}$/i.test(p[0]))return'';return p[0].toLowerCase()}catch{return''}}
function hosted(){return ['http:','https:'].includes(location.protocol)&&!!location.hostname}
function name(u){const c=twitchChannel(u);if(c)return'Twitch: '+c;try{return new URL(u).hostname.replace(/^www\./,'')}catch{return'Website'}}
function clean(o){if(!o||typeof o.url!=='string')return null;return{id:o.id||id(),url:o.url,volume:Number.isFinite(+o.volume)?Math.max(0,Math.min(1,+o.volume)):.5,muted:typeof o.muted==='boolean'?o.muted:true,quality:typeof o.quality==='string'?o.quality:''}}
function load(){try{const a=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(OLD));if(Array.isArray(a)){const b=a.map(clean).filter(Boolean);if(b.length)return b}}catch{}return[{id:id(),url:'https://www.twitch.tv/potasticp',volume:.5,muted:true,quality:''}]}
function save(){localStorage.setItem(STORE,JSON.stringify(sites))}function msg(t){status.textContent=t}
function addSite(){const u=norm(newUrl.value);if(!u)return msg('Please enter a valid website address.');sites.push({id:id(),url:u,volume:.5,muted:true,quality:''});save();newUrl.value='';render();msg(name(u)+' added.')}
function removeSite(i){players.delete(i);sites=sites.filter(s=>s.id!==i);save();render()}
function changeSite(i,v){const u=norm(v),s=sites.find(x=>x.id===i);if(!u||!s)return msg('That website address is not valid.');s.url=u;s.quality='';save();render();msg(name(u)+' loaded.')}
function reloadSite(i){const s=sites.find(x=>x.id===i),p=players.get(i),c=s&&twitchChannel(s.url);if(c&&p){try{p.setChannel(c);return}catch{}}const f=document.querySelector(`[data-frame="${CSS.escape(i)}"]`);if(f){const u=f.src;f.src='about:blank';setTimeout(()=>f.src=u,25)}}
function fullscreen(i){document.querySelector(`[data-card="${CSS.escape(i)}"]`)?.requestFullscreen?.()}
function applyMode(){document.body.classList.toggle('scroll',mode==='scroll');$('#mode').textContent=mode==='fit'?'Mode: Fit All':'Mode: Comfortable';localStorage.setItem(MODE,mode)}
function grid(){if(mode!=='fit')return;const n=sites.length;if(!n){dash.style.gridTemplateColumns='1fr';dash.style.gridTemplateRows='1fr';return}const w=Math.max(dash.clientWidth,1),h=Math.max(dash.clientHeight,1),a=w/h;let c=Math.max(1,Math.min(Math.ceil(Math.sqrt(n*a)),n)),best=c,score=-1e9;for(let x=Math.max(1,c-2);x<=Math.min(n,c+2);x++){const r=Math.ceil(n/x),cw=w/x,ch=h/r,sc=Math.log(Math.max(cw*ch,1))-Math.abs(Math.log((cw/ch)/1.45))-(x*r-n)*.08;if(sc>score){score=sc;best=x}}dash.style.gridTemplateColumns=`repeat(${best},minmax(0,1fr))`;dash.style.gridTemplateRows=`repeat(${Math.ceil(n/best)},minmax(0,1fr))`}
function qvalue(q){if(typeof q==='string')return q;if(q&&typeof q==='object')return String(q.group??q.value??q.id??q.name??'');return String(q??'')}
function qlabel(q){if(q&&typeof q==='object'){const raw=String(q.name??q.label??q.group??q.value??q.id??'');const v=qvalue(q);if(raw&&raw!=='[object Object]')return raw;if(v==='chunked')return'Source';if(v==='auto')return'Auto';return v||'Unknown'}const v=qvalue(q);return v==='chunked'?'Source':v==='auto'?'Auto':v}
function fillQualities(p,sel,s){let raw=[],cur='';try{raw=p.getQualities()||[];cur=qvalue(p.getQuality()||'')}catch{return}if(!Array.isArray(raw)||!raw.length)return;const qs=raw.map(q=>({value:qvalue(q),label:qlabel(q)})).filter(q=>q.value);if(!qs.length)return;sel.innerHTML='';qs.forEach(q=>{const o=document.createElement('option');o.value=q.value;o.textContent=q.label;sel.appendChild(o)});const values=qs.map(q=>q.value),d=s.quality&&values.includes(s.quality)?s.quality:cur;if(d&&values.includes(d))sel.value=d;if(s.quality&&values.includes(s.quality)&&cur!==s.quality)try{p.setQuality(s.quality)}catch{}sel.disabled=false}
function makePlayer(s,c,host,qsel,slider,vnum,mute){if(!hosted()||!window.Twitch?.Player)return;const p=new Twitch.Player(host.id,{width:'100%',height:'100%',channel:c,parent:[location.hostname],autoplay:false,muted:s.muted});players.set(s.id,p);const audio=()=>{try{p.setVolume(s.volume);p.setMuted(s.muted)}catch{}slider.value=Math.round(s.volume*100);vnum.textContent=Math.round(s.volume*100)+'%';mute.textContent=s.muted?'🔇':'🔊';mute.title=s.muted?'Unmute this stream':'Mute this stream'};p.addEventListener(Twitch.Player.READY,()=>{audio();fillQualities(p,qsel,s)});p.addEventListener(Twitch.Player.PLAYING,()=>fillQualities(p,qsel,s));qsel.onchange=()=>{try{p.setQuality(qsel.value);s.quality=qsel.value;save();msg(name(s.url)+' quality: '+qlabel(qsel.value))}catch{msg('That quality is not currently available.')}};slider.oninput=()=>{s.volume=Math.max(0,Math.min(1,+slider.value/100));try{p.setVolume(s.volume)}catch{}vnum.textContent=Math.round(s.volume*100)+'%';save()};mute.onclick=()=>{s.muted=!s.muted;try{p.setMuted(s.muted)}catch{}audio();save()}}
function render(){players.clear();dash.innerHTML='';if(!sites.length){dash.innerHTML='<div class="empty"><div><strong>Add your first website</strong>Paste an address above. Twitch channel URLs automatically receive quality and audio controls.</div></div>';return grid()}for(const s of sites){const c=twitchChannel(s.url),card=document.createElement('section');card.className='card';card.dataset.card=s.id;card.draggable=true;const head=document.createElement('div');head.className='head';const handle=document.createElement('span');handle.className='handle';handle.textContent='☷';const input=document.createElement('input');input.className='panelurl';input.value=s.url;const go=document.createElement('button');go.className='small';go.textContent='Go';const refresh=document.createElement('button');refresh.className='small';refresh.textContent='↻';const open=document.createElement('button');open.className='small';open.textContent='↗';const full=document.createElement('button');full.className='small';full.textContent='⛶';const del=document.createElement('button');del.className='small danger';del.textContent='✕';head.append(handle,input,go,refresh,open,full,del);card.append(head);const frame=document.createElement('div');frame.className='frame';let qsel,slider,vnum,mute,host;if(c){const tc=document.createElement('div');tc.className='tcontrols';const ql=document.createElement('label');ql.textContent='Quality';qsel=document.createElement('select');qsel.className='quality';qsel.disabled=true;qsel.innerHTML='<option>Loading…</option>';const al=document.createElement('label');al.textContent='Audio';mute=document.createElement('button');mute.className='small mute';mute.textContent=s.muted?'🔇':'🔊';slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=100;slider.step=1;slider.value=Math.round(s.volume*100);slider.className='vol';vnum=document.createElement('span');vnum.className='volnum';vnum.textContent=Math.round(s.volume*100)+'%';tc.append(ql,qsel,al,mute,slider,vnum);card.append(tc);if(hosted()){host=document.createElement('div');host.className='twitchhost';host.id='tp-'+s.id.replace(/[^a-z0-9_-]/gi,'');frame.append(host)}else frame.innerHTML='<div class="msg"><div><strong>Twitch needs HTTPS hosting</strong>Open this dashboard from GitHub Pages to use Twitch playback, quality and audio controls.</div></div>'}else{const f=document.createElement('iframe');f.src=s.url;f.dataset.frame=s.id;f.allow='autoplay; fullscreen; clipboard-read; clipboard-write';f.allowFullscreen=true;frame.append(f)}card.append(frame);dash.append(card);go.onclick=()=>changeSite(s.id,input.value);input.onkeydown=e=>{if(e.key==='Enter')changeSite(s.id,input.value)};refresh.onclick=()=>reloadSite(s.id);open.onclick=()=>window.open(s.url,'_blank','noopener,noreferrer');full.onclick=()=>fullscreen(s.id);del.onclick=()=>removeSite(s.id);card.ondragstart=e=>{dragId=s.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'};card.ondragend=()=>{dragId=null;card.classList.remove('dragging')};card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();if(!dragId||dragId===s.id)return;const a=sites.findIndex(x=>x.id===dragId),b=sites.findIndex(x=>x.id===s.id);if(a<0||b<0)return;const[m]=sites.splice(a,1);sites.splice(b,0,m);save();render()};if(c&&host)makePlayer(s,c,host,qsel,slider,vnum,mute)}grid()}
$('#add').onclick=addSite;newUrl.onkeydown=e=>{if(e.key==='Enter')addSite()};$('#clear').onclick=()=>{if(sites.length&&confirm('Remove every website from the dashboard?')){sites=[];save();render()}};$('#reloadAll').onclick=()=>{sites.forEach(s=>reloadSite(s.id));msg('Reloaded all websites.')};$('#mode').onclick=()=>{mode=mode==='fit'?'scroll':'fit';applyMode();grid()};addEventListener('resize',grid);applyMode();save();render();
</script>
</body>
</html>
